name: Screenshot to PDF and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  screenshot-to-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set name as env
        run: echo "NAME=$(grep fullName resume.yaml | awk -F ':' '{print $2}' | tr -d '"' | sed 's/ //')" >> $GITHUB_ENV

      - name: Install exiftool, img2pdf, ocrmypdf
        run: sudo apt update && sudo apt install -y libimage-exiftool-perl img2pdf ocrmypdf

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      - name: Install Playwright browsers
        run: playwright install --with-deps 

      - name: Run Playwright screenshot script
        run: |
          python scripts/screenshot.py

      - name: Convert screenshot to PDF
        run: |
          img2pdf screenshot.png --output screenshot.pdf

      - name: OCR the PDF
        run: |
          ocrmypdf --force-ocr --title "Resume - $NAME" --author "$NAME" screenshot.pdf screenshot_ocr.pdf

      - name: Modify PDF metadata with exiftool
        run: |
          exiftool -Creator="$NAME" -Producer="$NAME" -Title="Resume - $NAME" -Author="$NAME" screenshot_ocr.pdf
          mv screenshot_ocr.pdf CV-${GITHUB_REF#refs/*/}.pdf

      - name: Create GitHub Release
        run: gh release create ${GITHUB_REF#refs/*/} -t ${GITHUB_REF#refs/*/} --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash

      - name: Upload pdf to Release
        run: gh release upload ${GITHUB_REF#refs/*/} CV-${GITHUB_REF#refs/*/}.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
